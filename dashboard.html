<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Gazette — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink:        #1a1714;
      --paper:      #f7f4ee;
      --cream:      #ede9df;
      --rule:       #c8c0b0;
      --accent:     #2b4a2f;
      --accent-lt:  #e8efe8;
      --muted:      #7a7063;
      --danger:     #8b2a2a;
      --danger-lt:  #f9eeee;
      --col-width:  680px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 17px;
      line-height: 1.65;
      min-height: 100vh;
    }

    .masthead {
      border-bottom: 3px double var(--ink);
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .masthead-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .masthead-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .masthead-subtitle {
      font-family: 'Source Serif 4', serif;
      font-size: 13px;
      font-style: italic;
      color: var(--muted);
      margin-top: 4px;
    }
    .signout-btn {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: 1px solid var(--rule);
      padding: 8px 14px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .signout-btn:hover { color: var(--ink); border-color: var(--ink); }

    .page {
      max-width: var(--col-width);
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .section-rule { flex: 1; border: none; border-top: 1px solid var(--rule); }

    .dashboard-section { margin-bottom: 52px; }

    .next-issue-banner {
      background: var(--cream);
      border: 1px solid var(--rule);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 52px;
      flex-wrap: wrap;
    }
    .next-issue-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .next-issue-date {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-style: italic;
    }
    .next-issue-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
    }

    .columnist-cards { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
    .columnist-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid var(--rule);
      padding: 13px 16px;
      gap: 12px;
      transition: border-color 0.15s, opacity 0.25s, transform 0.25s;
    }
    .columnist-card:hover { border-color: var(--ink); }
    .columnist-card.removing { opacity: 0; transform: translateX(-8px); }
    .columnist-info { flex: 1; min-width: 0; }
    .columnist-email {
      font-family: 'Source Serif 4', serif;
      font-size: 15px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .columnist-since {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }
    .remove-columnist-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 18px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-columnist-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-lt);
    }
    .confirm-remove {
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .confirm-remove.visible { display: flex; }
    .confirm-remove span {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--danger);
    }
    .confirm-yes, .confirm-no {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid;
      cursor: pointer;
      background: none;
    }
    .confirm-yes { border-color: var(--danger); color: var(--danger); }
    .confirm-yes:hover { background: var(--danger); color: #fff; }
    .confirm-no  { border-color: var(--rule); color: var(--muted); }
    .confirm-no:hover { border-color: var(--ink); color: var(--ink); }

    .add-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 12px;
    }
    .add-row input {
      flex: 1;
      background: #fff;
      border: 1px solid var(--rule);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      border-radius: 0;
      -webkit-appearance: none;
    }
    .add-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-lt); }
    .add-row input.error { border-color: var(--danger); }
    .add-row-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 11px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .add-row-btn:hover { background: #1e3621; }
    .add-hint {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }
    .add-error {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--danger);
      margin-top: 6px;
      display: none;
    }
    .add-error.visible { display: block; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink);
      color: var(--paper);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 20px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .issue-list { display: flex; flex-direction: column; gap: 2px; }
    .issue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid var(--rule);
      padding: 13px 16px;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .issue-row:hover { border-color: var(--ink); }
    .issue-info { flex: 1; }
    .issue-title { font-family: 'Playfair Display', serif; font-size: 15px; font-style: italic; }
    .issue-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }
    .download-btn {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      background: none;
      border: 1px solid var(--accent);
      padding: 7px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .download-btn:hover { background: var(--accent); color: #fff; }

    .empty-state {
      font-size: 14px;
      font-style: italic;
      color: var(--muted);
      padding: 20px 0 4px;
    }

    .loading {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 20px 0;
    }

    footer {
      border-top: 1px solid var(--rule);
      text-align: center;
      padding: 18px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .page { padding: 28px 16px 60px; }
      .next-issue-meta { text-align: left; }
      .masthead { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header class="masthead">
    <div>
      <p class="masthead-eyebrow">Your dashboard</p>
      <div class="masthead-title" id="masthead-title">Your Gazette</div>
      <p class="masthead-subtitle">Delivered every Sunday morning</p>
    </div>
    <button class="signout-btn" id="signout-btn">Sign out</button>
  </header>

  <main class="page">

    <!-- Next issue -->
    <div class="next-issue-banner">
      <div>
        <p class="next-issue-label">Next issue</p>
        <p class="next-issue-date" id="next-issue-date"></p>
      </div>
      <div class="next-issue-meta" id="next-issue-meta"></div>
    </div>

    <!-- Columnists -->
    <div class="dashboard-section">
      <div class="section-head">
        <span class="section-label">Your columnists</span>
        <hr class="section-rule"/>
      </div>
      <div class="columnist-cards" id="columnist-cards">
        <p class="loading">Loading columnists…</p>
      </div>
      <div class="add-row">
        <input type="email" id="new-columnist-email" placeholder="Add a columnist by email address"/>
        <button class="add-row-btn" id="add-columnist-btn">Add</button>
      </div>
      <p class="add-error" id="add-error"></p>
      <p class="add-hint">They'll receive their first invitation this Friday at 6 pm.</p>
    </div>

    <!-- Past issues -->
    <div class="dashboard-section">
      <div class="section-head">
        <span class="section-label">Past issues</span>
        <hr class="section-rule"/>
      </div>
      <div class="issue-list" id="issue-list">
        <p class="loading">Loading past issues…</p>
      </div>
    </div>

  </main>

  <footer>Your Gazette &nbsp;·&nbsp; A personal paper for people you love</footer>
  <div class="toast" id="toast"></div>

  <script>
    // ── Supabase setup ──
    const SUPABASE_URL  = 'https://ccmhhimbiwppsunoakwd.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_OuUvPtPrt3KkNMvLKV1rJg_jvk905gT';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    var SCHEDULER_URL = 'your-gazette-production.up.railway.app';
    var subscriber   = null;
    var columnistData = [];

    // ── Boot: check session ──
    async function init() {
      var sessionResult = await db.auth.getSession();
      var session = sessionResult.data.session;

      if (!session) {
        window.location.href = 'signup.html';
        return;
      }

      // Load subscriber record
      var subResult = await db
        .from('subscribers')
        .select('*')
        .eq('user_id', session.user.id)
        .single();

      if (subResult.error || !subResult.data) {
        window.location.href = 'signup.html';
        return;
      }

      subscriber = subResult.data;
      document.getElementById('masthead-title').textContent = subscriber.name + "'s Gazette";

      renderNextIssue();
      await loadColumnists();
      await loadPastIssues();
    }

    // ── Next issue banner ──
    function renderNextIssue() {
      var now      = new Date();
      var sunday   = new Date(now);
      var daysAhead = (7 - now.getDay()) % 7 || 7;
      sunday.setDate(now.getDate() + daysAhead);

      document.getElementById('next-issue-date').textContent =
        sunday.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      document.getElementById('next-issue-meta').innerHTML =
        columnistData.length + ' columnist' + (columnistData.length !== 1 ? 's' : '') + ' invited<br/>' +
        'Submissions close Sunday 5 am ET<br/>' +
        'Delivered Sunday 6 am ET';
    }

    // ── Load columnists ──
    async function loadColumnists() {
      var result = await db
        .from('columnists')
        .select('*')
        .eq('subscriber_id', subscriber.id)
        .order('added_at', { ascending: true });

      if (result.error) {
        document.getElementById('columnist-cards').innerHTML =
          '<p class="empty-state">Could not load columnists — please refresh.</p>';
        return;
      }

      columnistData = result.data || [];
      renderColumnists();
      renderNextIssue();
    }

    // ── Render columnists ──
    function renderColumnists() {
      var container = document.getElementById('columnist-cards');
      container.innerHTML = '';

      if (columnistData.length === 0) {
        container.innerHTML = '<p class="empty-state">No columnists yet — add someone below.</p>';
        return;
      }

      columnistData.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'columnist-card';
        card.id = 'card-' + c.id;

        var since = new Date(c.added_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        card.innerHTML =
          '<div class="columnist-info">' +
            '<div class="columnist-email">' + c.email + '</div>' +
            '<div class="columnist-since">Columnist since ' + since + '</div>' +
          '</div>' +
          '<div class="confirm-remove" id="confirm-' + c.id + '">' +
            '<span>Remove?</span>' +
            '<button class="confirm-yes" data-id="' + c.id + '">Yes</button>' +
            '<button class="confirm-no"  data-id="' + c.id + '">No</button>' +
          '</div>' +
          '<button class="remove-columnist-btn" id="removebtn-' + c.id + '" data-id="' + c.id + '">×</button>';

        container.appendChild(card);

        // Attach listeners
        card.querySelector('.remove-columnist-btn').addEventListener('click', function() {
          promptRemove(this.getAttribute('data-id'));
        });
        card.querySelector('.confirm-yes').addEventListener('click', function() {
          confirmRemove(this.getAttribute('data-id'));
        });
        card.querySelector('.confirm-no').addEventListener('click', function() {
          cancelRemove(this.getAttribute('data-id'));
        });
      });
    }

    function promptRemove(id) {
      document.getElementById('confirm-' + id).classList.add('visible');
      document.getElementById('removebtn-' + id).style.display = 'none';
    }

    function cancelRemove(id) {
      document.getElementById('confirm-' + id).classList.remove('visible');
      document.getElementById('removebtn-' + id).style.display = 'flex';
    }

    async function confirmRemove(id) {
      var card = document.getElementById('card-' + id);
      card.classList.add('removing');

      var result = await db.from('columnists').delete().eq('id', id);
      if (result.error) {
        card.classList.remove('removing');
        showToast('Could not remove columnist — please try again');
        return;
      }

      setTimeout(function() {
        columnistData = columnistData.filter(function(c) { return c.id !== id; });
        renderColumnists();
        renderNextIssue();
        showToast('Columnist removed');
      }, 250);
    }

    // ── Add columnist ──
    document.getElementById('add-columnist-btn').addEventListener('click', addColumnist);
    document.getElementById('new-columnist-email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addColumnist();
    });

    async function addColumnist() {
      var input   = document.getElementById('new-columnist-email');
      var errorEl = document.getElementById('add-error');
      var email   = input.value.trim().toLowerCase();

      errorEl.classList.remove('visible');
      input.classList.remove('error');

      if (!isValidEmail(email)) {
        errorEl.textContent = 'Please enter a valid email address.';
        errorEl.classList.add('visible');
        input.classList.add('error');
        input.focus();
        return;
      }

      if (columnistData.find(function(c) { return c.email === email; })) {
        errorEl.textContent = 'That email is already on your list.';
        errorEl.classList.add('visible');
        input.classList.add('error');
        input.focus();
        return;
      }

      var result = await db
        .from('columnists')
        .insert({ subscriber_id: subscriber.id, email: email })
        .select()
        .single();

      if (result.error) {
        errorEl.textContent = 'Could not add columnist — please try again.';
        errorEl.classList.add('visible');
        return;
      }

      input.value = '';
      columnistData.push(result.data);
      renderColumnists();
      renderNextIssue();
      showToast("Columnist added — they'll be invited this Friday");
    }

    // ── Load past issues ──
    async function loadPastIssues() {
      var result = await db
        .from('issues')
        .select('*')
        .eq('subscriber_id', subscriber.id)
        .order('issue_date', { ascending: false });

      var container = document.getElementById('issue-list');
      container.innerHTML = '';

      if (result.error || !result.data || result.data.length === 0) {
        container.innerHTML = '<p class="empty-state">Your first issue hasn\'t been published yet. Check back Sunday morning.</p>';
        return;
      }

      result.data.forEach(function(issue) {
        var row      = document.createElement('div');
        row.className = 'issue-row';
        var dateStr  = new Date(issue.issue_date).toLocaleDateString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
        });

        row.innerHTML =
          '<div class="issue-info">' +
            '<div class="issue-title">' + subscriber.name + "'s Gazette</div>" +
            '<div class="issue-meta">' + dateStr + ' &nbsp;·&nbsp; ' + issue.columnist_count + ' columnist' + (issue.columnist_count !== 1 ? 's' : '') + '</div>' +
          '</div>' +
          '<a class="download-btn" href="' + issue.pdf_url + '" download>Download &darr;</a>';

        container.appendChild(row);
      });
    }

    // ── Utilities ──
    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    var toastTimer;
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('visible'); }, 3000);
    }

    document.getElementById('signout-btn').addEventListener('click', async function() {
      await db.auth.signOut();
      window.location.href = 'signup.html';
    });

    // ── Start ──
    init();
  </script>

</body>
</html>
